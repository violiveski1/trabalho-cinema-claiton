<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luz & Cena</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <header class="cabecalho">
    <div class="cabecalho_inner">
      <img src="./assets/Logo.svg" class="logo" alt="Logo Luz & Cena">

      <nav class="cabecalho_nav">
        <a href="#" class="links">Eventos</a>
        <a href="#" class="links">Club fidelidade</a>
        <a href="#" class="links">Sobre nós</a>
      </nav>

      <div class="cabecalho_actions">
        <form class="cabecalho_search">
          <input type="search" class="cabecalho_search-input" placeholder="São José dos Campos">
          <img src="./assets/location_on.svg" class="cabecalho_search-icon" alt="Localização">
        </form>
        <img src="./assets/Carrinho.svg" class="icon" alt="Carrinho">
        <img src="./assets/Perfil.svg" class="icon" alt="Perfil">
      </div>
    </div>
  </header>


    <section class="banner">
<img
        class="banner-imagem"
        src="./assets/Banner.png"
        alt="Banner"/>

      <div class="banner-container">
        <h2 class="banner-container-titulo">
          Onde a <br>realidade <span>encontra a<br> fantasia</span>
        </h2>
      </div>
    </section>

    <section></section>

    <section></section>


  <footer></footer>

</body>
</html>
